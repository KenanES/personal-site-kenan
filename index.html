<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kenan · Photos</title>
  <meta name="description" content="Photographs of San Francisco and the Golden Gate.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Kenan</h1>
    <p class="tagline">Photographs from around San Francisco</p>
  </header>

  <main>
    <section class="gallery" aria-label="Photo gallery">
      <figure class="photo wide">
        <a href="photos/full/golden-gate-sunrise-fog.jpg">
          <img src="photos/thumb/golden-gate-sunrise-fog.jpg" width="900" height="675"
               alt="Sunrise over San Francisco with the Golden Gate Bridge in silhouette and fog rolling across the bay">
        </a>
        <figcaption>Sunrise over the fog</figcaption>
      </figure>

      <figure class="photo">
        <a href="photos/full/golden-gate-dusk-silhouette.jpg">
          <img src="photos/thumb/golden-gate-dusk-silhouette.jpg" width="675" height="900" loading="lazy"
               alt="Golden Gate Bridge tower silhouetted against an orange dusk sky, people walking on the beach below">
        </a>
        <figcaption>Dusk from Crissy Field</figcaption>
      </figure>

      <figure class="photo">
        <a href="photos/full/golden-gate-city-view.jpg">
          <img src="photos/thumb/golden-gate-city-view.jpg" width="675" height="900" loading="lazy"
               alt="Golden Gate Bridge in evening light with the San Francisco skyline across the bay">
        </a>
        <figcaption>The city at golden hour</figcaption>
      </figure>

      <figure class="photo">
        <a href="photos/full/golden-gate-tower-blue-sky.jpg">
          <img src="photos/thumb/golden-gate-tower-blue-sky.jpg" width="675" height="900" loading="lazy"
               alt="Close view of a red Golden Gate Bridge tower against a clear blue sky, the city skyline behind it">
        </a>
        <figcaption>International Orange</figcaption>
      </figure>

      <figure class="photo">
        <a href="photos/full/sutro-tower-fog.jpg">
          <img src="photos/thumb/sutro-tower-fog.jpg" width="667" height="900" loading="lazy"
               alt="The top of Sutro Tower poking up through a thick blanket of fog">
        </a>
        <figcaption>Sutro above the fog</figcaption>
      </figure>
    </section>
  </main>

  <dialog class="lightbox" aria-label="Enlarged photo">
    <button class="lightbox-close" type="button" aria-label="Close">×</button>
    <img alt="">
    <p class="lightbox-caption"></p>
  </dialog>

  <footer class="site-footer">
    <p>© <span id="year"></span> Kenan</p>
  </footer>

  <script>
    // Open full-size photos in a lightbox; links still work without JavaScript.
    const dialog = document.querySelector('.lightbox');
    const big = dialog.querySelector('img');
    const caption = dialog.querySelector('.lightbox-caption');

    document.querySelectorAll('.photo a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const thumb = link.querySelector('img');
        big.src = link.href;
        big.alt = thumb.alt;
        caption.textContent = link.closest('figure').querySelector('figcaption').textContent;
        dialog.showModal();
      });
    });

    dialog.querySelector('.lightbox-close').addEventListener('click', () => dialog.close());
    // Click on the backdrop (outside the image) closes it too
    dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
